[workspace]
resolver = "3"
members = [
    "crates/subtrackt-core",
    "crates/subtrackt-demux",
    "crates/subtrackt-decode",
    "crates/subtrackt-glyph",
    "crates/subtrackt-text",
    "crates/subtrackt",
    "crates/subtrackt-cli",
    "xtask",
]

[workspace.package]
version = "0.0.1-alpha"
edition = "2024"
rust-version = "1.98"
license = "MIT"
repository = "https://github.com/sovereign-media/Sovereign.SubTrackt"
authors = ["Sovereign Media"]

[workspace.dependencies]
subtrackt-core = { path = "crates/subtrackt-core", version = "0.0.1-alpha" }
subtrackt-demux = { path = "crates/subtrackt-demux", version = "0.0.1-alpha" }
subtrackt-decode = { path = "crates/subtrackt-decode", version = "0.0.1-alpha" }
subtrackt-glyph = { path = "crates/subtrackt-glyph", version = "0.0.1-alpha" }
subtrackt-text = { path = "crates/subtrackt-text", version = "0.0.1-alpha" }
subtrackt = { path = "crates/subtrackt", version = "0.0.1-alpha" }

anyhow = "1"
# The colour stack, named rather than inherited. `clap`'s default features already compile all
# three into the shipped binary, so declaring them adds no crate and no bytes -- see #83.
anstream = "1"
anstyle = "1"
anstyle-query = "1"
clap = { version = "4", features = ["derive"] }
fontdue = "0.9"
miniz_oxide = "0.8"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[profile.dev]
# Full debug info is the single largest contributor to link time and to target/ size, and almost
# none of it is used day to day. Line tables keep backtraces pointing at real file:line locations,
# which is what anyone actually reads, at a fraction of the cost.
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
