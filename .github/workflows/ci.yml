name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# A superseded commit is not worth building. Cancels in-flight runs for the same branch or PR,
# except on main, where every commit should get a recorded result.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Incremental artifacts are dead weight in CI: every run starts from a fresh checkout, so nothing
  # is ever reused, and they roughly double what the cache has to carry. sccache also refuses to
  # cache anything compiled with incremental enabled, so this is load-bearing for the below.
  CARGO_INCREMENTAL: 0
  # rust-cache handles ~/.cargo and dependency artifacts but deliberately drops workspace-own
  # crates, since serving a stale one would be worse than rebuilding. sccache closes that gap: it
  # keys each compilation unit by content, so our own crates survive across runs too. That is the
  # half of the build that grows as the project does.
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - uses: Swatinem/rust-cache@v2
        with:
          # Only main writes to the cache. Without this every PR branch saves its own copy, and
          # the repository's 10 GB budget evicts the one branch whose cache everything else
          # actually restores from.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Formatting
        run: cargo fmt --all -- --check

      # --locked so a Cargo.lock that drifted out of sync fails here rather than being silently
      # rewritten, which would make the cache key wrong for everyone downstream.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked

      - name: Tests
        run: cargo test --workspace --all-features --locked

      # The correctness gate. Everything else measures whether shapes look alike; this is the only
      # step that says whether the right characters come out. Ubuntu runners ship DejaVu, which the
      # harness discovers on its own.
      - name: Accuracy on generated ground truth
        run: cargo run -p xtask --release --locked -- accuracy

      # CLAUDE.md's dependency rule, enforced rather than remembered. `subtrackt-glyph` carries an
      # optional `fontdue` for #80, and the point of it being optional is that a consumer who does
      # not opt in still gets this tree. Feature unification makes that breakable by accident from
      # a different crate's manifest, which is not a change anyone would think to look for.
      - name: Dependency discipline
        run: |
          expected="adler2 miniz_oxide"
          actual=$(cargo tree -p subtrackt -e normal --prefix none --locked | awk '{print $1}' |
            grep -v '^subtrackt' | sort -u | xargs)
          if [ "$actual" != "$expected" ]; then
            echo "the subtrackt library tree changed."
            echo "  expected: $expected"
            echo "  got:      $actual"
            echo "If that is deliberate, justify it in CLAUDE.md and update this list."
            exit 1
          fi

      - name: Docs
        # Broken intra-doc links are how a rename quietly rots the architecture notes.
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --locked

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  cross:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    # Both architectures Sovereign ships, per the distribution discussion in #16, and both libc
    # flavours. The musl pair is what `release.yml` actually publishes, so it is checked here rather
    # than discovered to be broken by a tag; the gnu pair stays because a developer building locally
    # gets gnu, and the two disagree often enough to be worth catching separately.
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # On a pull request, type-check only. That catches everything target-specific — cfg gates,
      # pointer width, endianness — without paying for a fully optimised link of a binary nobody
      # will run. The real thing still gets built on main and on tags.
      - name: Check
        if: github.event_name == 'pull_request'
        run: cargo check --workspace --all-targets --target ${{ matrix.target }} --locked

      # Both aarch64 rows need this, not just the gnu one -- the musl row links with the same
      # cross gcc as its driver, and gating on gnu alone left it to fail at link time on main.
      - name: Install cross linker
        if: github.event_name != 'pull_request' && startsWith(matrix.target, 'aarch64-')
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          target=$(echo '${{ matrix.target }}' | tr 'a-z-' 'A-Z_')
          echo "CARGO_TARGET_${target}_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"

      - name: Build release binary
        if: github.event_name != 'pull_request'
        run: cargo build --release --target ${{ matrix.target }} -p subtrackt-cli --locked

      - name: sccache stats
        if: always()
        run: sccache --show-stats

  windows:
    name: windows tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      # RUSTC_WRAPPER is set for the whole workflow, so this is not optional here the way it looks
      # -- without it every rustc call on this runner tries to exec a binary that is not installed.
      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # `release.yml` publishes a Windows binary, and until it did, nothing in CI ever ran this code
      # on Windows -- path separators, line endings and case-insensitive filesystems were covered by
      # nothing but the maintainer's own machine. Tests rather than a type-check, because that is
      # the part a type-check cannot speak to.
      - name: Tests
        run: cargo test --workspace --all-features --locked

      # ARM64 Windows is cross-compiled from this same x86-64 runner at release time, so the
      # compile is proven here. Checked rather than built: linking is what the tag exercises.
      - name: Check aarch64
        run: cargo check --workspace --all-targets --target aarch64-pc-windows-msvc --locked
