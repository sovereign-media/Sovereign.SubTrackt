version: 2

updates:
  # Action versions drift silently and only surface as deprecation warnings on a runner, which is
  # easy to scroll past. Let Dependabot raise them as reviewable pull requests instead.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
    ignore:
      # dtolnay/rust-toolchain selects a Rust toolchain by ref name, so its "versions" are Rust
      # releases rather than releases of the action. Dependabot cannot tell the difference and
      # will happily propose a Rust version that has not shipped.
      - dependency-name: dtolnay/rust-toolchain
    commit-message:
      prefix: "ci"

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: monthly
    groups:
      # The library crates have no dependencies at all, so everything here belongs to the CLI.
      # One grouped pull request a month is proportionate.
      cargo:
        patterns: ['*']
    commit-message:
      prefix: "deps"
