[package]
name = "subtrackt-cli"
description = "Command-line front end for the SubTrackt subtitle text extractor."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[[bin]]
name = "subtrackt"
path = "src/main.rs"
# The binary shares its name with the `subtrackt` library crate, which collides in the rustdoc
# output directory. The binary has no public API worth documenting, so keep it out.
doc = false

[dependencies]
subtrackt.workspace = true
subtrackt-core.workspace = true
subtrackt-glyph.workspace = true

anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
