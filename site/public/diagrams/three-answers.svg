<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 528" width="640" height="528" role="img" aria-labelledby="t d">
<title id="t">The three answers the matcher can give</title>
<desc id="d">Three panels, each showing how far the closest reference entry and the runner-up sit from one shape, against the distance beyond which nothing is accepted. Matched: the closest is well inside the limit and the runner-up is far behind. Ambiguous: the closest is inside the limit but the runner-up is nearly as close. Unmatched: nothing is inside the limit at all, so nothing is written and the shape is counted.</desc>
<style>
  text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Inter, Roboto, "Helvetica Neue", sans-serif; }
  .mono { font-family: ui-monospace, "Geist Mono", SFMono-Regular, Menlo, Consolas, monospace; }
  .bg { fill: #ffffff; }
  .frame { fill: none; stroke: #e4e7ed; }
  .card { fill: #f7f8fa; stroke: #dfe3ea; }
  .io { fill: #ffffff; stroke: #c8cedb; stroke-dasharray: 4 3; }
  .watch { fill: #e9effd; stroke: #7aa2f7; }
  .stage { fill: #eef2f7; stroke: #d3dbe6; }
  .gate { fill: #fdf3e6; stroke: #edd3a8; }
  .band { fill: #e9effd; stroke: #c5d8fb; }
  .note { fill: #f2f5f9; stroke: #dde3ec; }
  .ink { fill: #1d2026; }
  .mut { fill: #667085; }
  .acc { fill: #2563eb; }
  .accs { fill: #e9effd; stroke: #c5d8fb; }
  .warn { fill: #b45309; }
  .warnink { fill: #97650f; }
  .good { fill: #15803d; }
  .bad { fill: #b42318; }
  .bar { fill: #97a1b2; }
  .cell { fill: #1d2026; }
  .grid { stroke: #d3d8e0; fill: none; }
  .cut { fill: none; stroke: #2563eb; stroke-dasharray: 3 3; }
  .rule { stroke: #e8ebf0; fill: none; }
  .limit { stroke: #b42318; fill: none; stroke-dasharray: 4 3; }
  .line { stroke: #b6bdc9; fill: none; }
  .lf { fill: #b6bdc9; }
  .head { fill: #1d2026; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #15171c; }
    .frame { stroke: #2b2f38; }
    .card { fill: #1c1f26; stroke: #30343e; }
    .io { fill: #15171c; stroke: #414855; }
    .watch { fill: #1b2436; stroke: #4d6699; }
    .stage { fill: #1f242c; stroke: #363d49; }
    .gate { fill: #2b2417; stroke: #4d3f22; }
    .band { fill: #1b2436; stroke: #31425f; }
    .note { fill: #1d222b; stroke: #2f353f; }
    .ink { fill: #e5e8ee; }
    .mut { fill: #98a1b0; }
    .acc { fill: #7aa2f7; }
    .accs { fill: #1b2436; stroke: #31425f; }
    .warn { fill: #e0a458; }
    .warnink { fill: #e0a458; }
    .good { fill: #6cc08b; }
    .bad { fill: #ef8a80; }
    .bar { fill: #6a7381; }
    .cell { fill: #e5e8ee; }
    .grid { stroke: #363b45; }
    .cut { stroke: #7aa2f7; }
    .rule { stroke: #23272f; }
    .limit { stroke: #ef8a80; }
    .line { stroke: #4b515d; }
    .lf { fill: #4b515d; }
    .head { fill: #f0f2f6; }
  }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path class="lf" d="M0 0 L10 5 L0 10 z"/>
  </marker>
</defs>

<rect class="bg" x="0" y="0" width="640" height="528"/>
<rect class="frame" x="0.5" y="0.5" width="639" height="527" rx="12"/>

<text class="head" x="24" y="34" font-size="16" font-weight="600">The three answers a shape can get</text>
<text class="mut" x="24" y="55" font-size="11.5">Distance is how many of the 256 cells disagree. Past the limit, nothing is accepted at all.</text>
<rect class="card" x="24" y="76" width="592" height="124" rx="9"/>
<text class="good" x="44" y="102" font-size="15" font-weight="600">matched</text>
<text class="bad" x="387.40000000000003" y="102" font-size="9.5" text-anchor="middle">LIMIT</text>
<path class="limit" d="M387.40000000000003 108 v52"/>
<text class="mut" x="44" y="122" font-size="11">closest</text>
<rect class="good" x="112" y="112" width="43" height="12" rx="3"/>
<text class="ink mono" x="163.2" y="122" font-size="11.5">8</text>
<text class="mut" x="44" y="146" font-size="11">runner-up</text>
<rect class="bar" x="112" y="136" width="167" height="12" rx="3"/>
<text class="ink mono" x="287.4" y="146" font-size="11.5">31</text>
<text class="ink" x="44" y="174" font-size="11.5">Close, and nothing else is anywhere near it. The character is written</text>
<text class="ink" x="44" y="190" font-size="11.5">out, and counted as one the tool read.</text>
<rect class="card" x="24" y="212" width="592" height="124" rx="9"/>
<text class="warn" x="44" y="238" font-size="15" font-weight="600">ambiguous</text>
<text class="bad" x="387.40000000000003" y="238" font-size="9.5" text-anchor="middle">LIMIT</text>
<path class="limit" d="M387.40000000000003 244 v52"/>
<text class="mut" x="44" y="258" font-size="11">closest</text>
<rect class="warn" x="112" y="248" width="65" height="12" rx="3"/>
<text class="ink mono" x="184.8" y="258" font-size="11.5">12</text>
<text class="mut" x="44" y="282" font-size="11">runner-up</text>
<rect class="bar" x="112" y="272" width="81" height="12" rx="3"/>
<text class="ink mono" x="201.0" y="282" font-size="11.5">15</text>
<text class="ink" x="44" y="310" font-size="11.5">Close enough — but so is the next one along. The best candidate is</text>
<text class="ink" x="44" y="326" font-size="11.5">written out, and the report says how often that happened.</text>
<rect class="card" x="24" y="348" width="592" height="124" rx="9"/>
<text class="bad" x="44" y="374" font-size="15" font-weight="600">unmatched</text>
<text class="bad" x="387.40000000000003" y="374" font-size="9.5" text-anchor="middle">LIMIT</text>
<path class="limit" d="M387.40000000000003 380 v52"/>
<text class="mut" x="44" y="394" font-size="11">closest</text>
<rect class="bar" x="112" y="384" width="275" height="12" rx="3"/>
<rect class="bad" x="387" y="384" width="32" height="12"/>
<text class="bad mono" x="427.8" y="394" font-size="11.5">57</text>
<text class="mut" x="44" y="418" font-size="11">runner-up</text>
<rect class="bar" x="112" y="408" width="275" height="12" rx="3"/>
<rect class="bad" x="387" y="408" width="54" height="12"/>
<text class="bad mono" x="449.40000000000003" y="418" font-size="11.5">61</text>
<text class="ink" x="44" y="446" font-size="11.5">Nothing the set knows is within reach at all. Nothing is written, the</text>
<text class="ink" x="44" y="462" font-size="11.5">shape is counted — and that count is the whole point.</text>
<text class="mut" x="24" y="510" font-size="11">An OCR engine has no third row. It would return the nearest letter in all three cases.</text>
</svg>
