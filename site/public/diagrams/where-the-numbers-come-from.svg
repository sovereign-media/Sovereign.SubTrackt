<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 626" width="640" height="626" role="img" aria-labelledby="t d">
<title id="t">Which stage produces which number in the report</title>
<desc id="d">The eight pipeline stages down the left, with the fields of the extraction report beside the stage that produced each one. Demux produces the packet count, decode the picture count, segment the de-fused count. Match produces the matched, unmatched and ambiguous counts, the percentage read, the mean fit and the cache rate. Assemble produces the cue count and the correction count. Binarize, vectorize and write produce no number. Below them, the accuracy gate fails the run when too little of the track was read.</desc>
<style>
  text { font-family: ui-sans-serif, -apple-system, "Segoe UI", Inter, Roboto, "Helvetica Neue", sans-serif; }
  .mono { font-family: ui-monospace, "Geist Mono", SFMono-Regular, Menlo, Consolas, monospace; }
  .bg { fill: #ffffff; }
  .frame { fill: none; stroke: #e4e7ed; }
  .card { fill: #f7f8fa; stroke: #dfe3ea; }
  .io { fill: #ffffff; stroke: #c8cedb; stroke-dasharray: 4 3; }
  .watch { fill: #e9effd; stroke: #7aa2f7; }
  .stage { fill: #eef2f7; stroke: #d3dbe6; }
  .gate { fill: #fdf3e6; stroke: #edd3a8; }
  .band { fill: #e9effd; stroke: #c5d8fb; }
  .note { fill: #f2f5f9; stroke: #dde3ec; }
  .ink { fill: #1d2026; }
  .mut { fill: #667085; }
  .acc { fill: #2563eb; }
  .accs { fill: #e9effd; stroke: #c5d8fb; }
  .warn { fill: #b45309; }
  .warnink { fill: #97650f; }
  .good { fill: #15803d; }
  .bad { fill: #b42318; }
  .bar { fill: #97a1b2; }
  .cell { fill: #1d2026; }
  .grid { stroke: #d3d8e0; fill: none; }
  .cut { fill: none; stroke: #2563eb; stroke-dasharray: 3 3; }
  .rule { stroke: #e8ebf0; fill: none; }
  .limit { stroke: #b42318; fill: none; stroke-dasharray: 4 3; }
  .line { stroke: #b6bdc9; fill: none; }
  .lf { fill: #b6bdc9; }
  .head { fill: #1d2026; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #15171c; }
    .frame { stroke: #2b2f38; }
    .card { fill: #1c1f26; stroke: #30343e; }
    .io { fill: #15171c; stroke: #414855; }
    .watch { fill: #1b2436; stroke: #4d6699; }
    .stage { fill: #1f242c; stroke: #363d49; }
    .gate { fill: #2b2417; stroke: #4d3f22; }
    .band { fill: #1b2436; stroke: #31425f; }
    .note { fill: #1d222b; stroke: #2f353f; }
    .ink { fill: #e5e8ee; }
    .mut { fill: #98a1b0; }
    .acc { fill: #7aa2f7; }
    .accs { fill: #1b2436; stroke: #31425f; }
    .warn { fill: #e0a458; }
    .warnink { fill: #e0a458; }
    .good { fill: #6cc08b; }
    .bad { fill: #ef8a80; }
    .bar { fill: #6a7381; }
    .cell { fill: #e5e8ee; }
    .grid { stroke: #363b45; }
    .cut { stroke: #7aa2f7; }
    .rule { stroke: #23272f; }
    .limit { stroke: #ef8a80; }
    .line { stroke: #4b515d; }
    .lf { fill: #4b515d; }
    .head { fill: #f0f2f6; }
  }
</style>
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path class="lf" d="M0 0 L10 5 L0 10 z"/>
  </marker>
</defs>

<rect class="bg" x="0" y="0" width="640" height="626"/>
<rect class="frame" x="0.5" y="0.5" width="639" height="625" rx="12"/>

<text class="head" x="24" y="34" font-size="16" font-weight="600">Where each number in the report comes from</text>
<text class="mut" x="24" y="55" font-size="11.5">Every field a run prints, beside the stage that counted it. Three stages count nothing.</text>
<rect class="watch" x="430" y="66" width="12" height="12" rx="4"/>
<text class="mut" x="448" y="76" font-size="10.5">the two worth watching</text>
<rect class="stage" x="24" y="100.0" width="110" height="30" rx="8"/>
<text class="acc" x="79" y="120.0" font-size="12.5" text-anchor="middle" font-weight="600">demux</text>
<rect class="card" x="150" y="100" width="140" height="24" rx="6"/>
<text class="ink mono" x="160" y="116" font-size="10.5">1644 packets</text>
<path class="rule" d="M24 138 h592"/>
<rect class="stage" x="24" y="146.0" width="110" height="30" rx="8"/>
<text class="acc" x="79" y="166.0" font-size="12.5" text-anchor="middle" font-weight="600">decode</text>
<rect class="card" x="150" y="146" width="140" height="24" rx="6"/>
<text class="ink mono" x="160" y="162" font-size="10.5">822 images</text>
<path class="rule" d="M24 184 h592"/>
<rect class="stage" x="24" y="192.0" width="110" height="30" rx="8"/>
<text class="acc" x="79" y="212.0" font-size="12.5" text-anchor="middle" font-weight="600">binarize</text>
<text class="mut" x="150" y="211.0" font-size="11.5">nothing to count, and that is fine</text>
<path class="rule" d="M24 230 h592"/>
<rect class="stage" x="24" y="238.0" width="110" height="30" rx="8"/>
<text class="acc" x="79" y="258.0" font-size="12.5" text-anchor="middle" font-weight="600">segment</text>
<rect class="card" x="150" y="238" width="140" height="24" rx="6"/>
<text class="ink mono" x="160" y="254" font-size="10.5">defused 87</text>
<path class="rule" d="M24 276 h592"/>
<rect class="stage" x="24" y="284.0" width="110" height="30" rx="8"/>
<text class="acc" x="79" y="304.0" font-size="12.5" text-anchor="middle" font-weight="600">vectorize</text>
<text class="mut" x="150" y="303.0" font-size="11.5">nothing to count, and that is fine</text>
<path class="rule" d="M24 322 h592"/>
<rect class="stage" x="24" y="345.0" width="110" height="30" rx="8"/>
<text class="acc" x="79" y="365.0" font-size="12.5" text-anchor="middle" font-weight="600">match</text>
<rect class="card" x="150" y="330" width="140" height="24" rx="6"/>
<text class="ink mono" x="160" y="346" font-size="10.5">20597 matched</text>
<rect class="watch" x="300" y="330" width="140" height="24" rx="6"/>
<text class="acc mono" x="310" y="346" font-size="10.5">17 unmatched</text>
<rect class="card" x="450" y="330" width="140" height="24" rx="6"/>
<text class="ink mono" x="460" y="346" font-size="10.5">2237 ambiguous</text>
<rect class="card" x="150" y="360" width="140" height="24" rx="6"/>
<text class="ink mono" x="160" y="376" font-size="10.5">99.9% read</text>
<rect class="watch" x="300" y="360" width="140" height="24" rx="6"/>
<text class="acc mono" x="310" y="376" font-size="10.5">fit 10.7</text>
<rect class="card" x="450" y="360" width="140" height="24" rx="6"/>
<text class="ink mono" x="460" y="376" font-size="10.5">cache 100%</text>
<path class="rule" d="M24 398 h592"/>
<rect class="stage" x="24" y="406.0" width="110" height="30" rx="8"/>
<text class="acc" x="79" y="426.0" font-size="12.5" text-anchor="middle" font-weight="600">assemble</text>
<rect class="card" x="150" y="406" width="140" height="24" rx="6"/>
<text class="ink mono" x="160" y="422" font-size="10.5">822 cues</text>
<rect class="card" x="300" y="406" width="140" height="24" rx="6"/>
<text class="ink mono" x="310" y="422" font-size="10.5">corrections 3</text>
<path class="rule" d="M24 444 h592"/>
<rect class="stage" x="24" y="452.0" width="110" height="30" rx="8"/>
<text class="acc" x="79" y="472.0" font-size="12.5" text-anchor="middle" font-weight="600">write</text>
<text class="mut" x="150" y="471.0" font-size="11.5">nothing to count, and that is fine</text>
<path class="rule" d="M24 490 h592"/>
<rect class="gate" x="24" y="508" width="592" height="54" rx="9"/>
<text class="warnink" x="42" y="530" font-size="12.5" font-weight="600">and then the gate</text>
<text class="ink" x="42" y="549" font-size="11">Too little read, and the run fails with no file at all — rather than a file that looks fine.</text>
<text class="ink" x="24" y="586" font-size="11.5">Every one of these is a count or a measurement. Not one is an opinion — and not one says</text>
<text class="ink" x="24" y="603" font-size="11.5">whether the text that came out is <tspan font-style="italic">right</tspan>. Nothing here can.</text>
</svg>
